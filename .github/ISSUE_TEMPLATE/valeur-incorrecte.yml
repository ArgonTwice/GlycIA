name: Valeur nutritionnelle incorrecte
description: Un aliment de la base affiche de mauvais chiffres
labels: [données]
body:
  - type: input
    id: aliment
    attributes: { label: Aliment concerné, placeholder: "Big Mac" }
    validations: { required: true }
  - type: input
    id: actuel
    attributes: { label: Valeur affichée, placeholder: "21 g de glucides / 100 g" }
    validations: { required: true }
  - type: input
    id: correct
    attributes: { label: Valeur correcte, placeholder: "19 g de glucides / 100 g" }
    validations: { required: true }
  - type: input
    id: source
    attributes:
      label: Source
      description: Étiquette du produit, table CIQUAL, fiche fabricant. Une photo d'étiquette convient.
    validations: { required: true }
