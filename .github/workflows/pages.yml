name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # regénération de standalone.html
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Contrôle de syntaxe
        run: |
          node --check app.js
          node --check sw.js
          node --check worker/worker.js
          node -e "JSON.parse(require('fs').readFileSync('db.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Tests
        run: node --test "tools/test/*.test.mjs"

      - name: Régénérer standalone.html
        run: node build.mjs

      - name: Vérifier le fichier autonome
        run: |
          node -e "
            const fs=require('fs');
            const h=fs.readFileSync('standalone.html','utf8');
            const m=h.match(/<script type=\"module\">([\s\S]*)<\/script>/);
            if(!m) throw new Error('script introuvable');
            fs.writeFileSync('/tmp/inline.js', m[1]);
          "
          node --check /tmp/inline.js
          rm /tmp/inline.js

      - name: Commiter si le fichier autonome a changé
        run: |
          if [ -n "$(git status --porcelain standalone.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add standalone.html
            git commit -m "build: regénère standalone.html [skip ci]"
            git push
          else
            echo "standalone.html déjà à jour"
          fi

      - name: Assembler le site publié
        run: |
          mkdir -p _site
          cp index.html app.js db.json ciqual.json off-fr.json sw.js icon.svg manifest.webmanifest standalone.html _site/
          echo "Publie : $(ls _site | tr '\n' ' ')"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
